name: Deploy (production)

# Production deploy. Triggered by a merge to `master`, but GATED: the job pauses
# on the `production` Environment until a required reviewer clicks Approve, so
# nothing ships to https://pkubersua.web.id without a human OK.
#
#   Release : merge a PR to master -> approve the "Waiting" deployment in Actions
#   Rollback: Actions -> Deploy (production) -> "Run workflow" -> enter an older
#             immutable image tag (e.g. sha-abc1234; NOT latest)
#
# Requires (see DEPLOY.md):
#   - REPO-level secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_DIR
#     (repo-level, not environment-level, so the staging workflow can share them)
#   - `production` Environment with Required reviewers + a branch policy allowing `master`
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image:
        description: "Immutable image tag to redeploy, e.g. sha-abc1234 (NOT latest — latest is overwritten on every deploy, so it never rolls back)"
        required: true

# Never run two production-target deploys at once (staging shares this group).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pkubersua.web.id
    steps:
      - name: Resolve image tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ver.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.ver.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image from the merged commit and push it as :sha-<short> plus
      # :latest. On a rollback run this is skipped — the older image already
      # exists in GHCR and the server just pulls it.
      - name: Build and push release image
        if: steps.ver.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.web.id' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL || 'hello@pkubersua.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export IMAGE_TAG='${{ steps.ver.outputs.tag }}'
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
