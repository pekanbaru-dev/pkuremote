name: Deploy

# Production deploy, triggered ONLY by pushing a version tag (e.g. v1.2.0) or by
# a manual run (for rollback). No image is built on regular pushes to main, so
# this is the single place a production image is created and shipped.
#
#   Release : git tag v1.2.0 && git push origin v1.2.0
#   Rollback: Actions -> Deploy -> "Run workflow" -> enter an older tag (v1.1.0)
#
# DORMANT until you: (1) create the `production` GitHub Environment with the
# SSH_* secrets, and (2) have a server running docker-compose.deploy.yml.
# See DEPLOY.md for the full first-run setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy, e.g. v1.1.0 — used for rollback."
        required: true

# Never run two production deploys at once; do NOT cancel one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ver.outputs.build == 'true'

      - name: Set up Buildx
        if: steps.ver.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.ver.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # New release: build the image from the tagged commit and push it as the
      # version tag plus `latest`. On a rollback run this is skipped — the older
      # image already exists in GHCR and the server just pulls it.
      - name: Build and push release image
        if: steps.ver.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL || 'hello@pkubersua.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH to the server and roll the stack to the target image tag. Secrets and
      # the branch/tag policy live on the `production` Environment.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            export IMAGE_TAG='${{ steps.ver.outputs.version }}'
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
