name: Deploy (production)

# Production deploy. Triggered by a merge to `master`, but GATED: the job pauses
# on the `production` Environment until a required reviewer clicks Approve, so
# nothing ships to https://pkubersua.com without a human OK.
#
#   Release : merge a PR to master -> approve the "Waiting" deployment in Actions
#   Rollback: Actions -> Deploy (production) -> "Run workflow" -> enter an older
#             immutable image tag (e.g. sha-abc1234; NOT latest)
#
# Requires (see DEPLOY.md):
#   - REPO-level secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_DIR
#     (repo-level, not environment-level, so the staging workflow can share them)
#   - `production` Environment with Required reviewers + a branch policy allowing `master`
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image:
        description: "Immutable image tag to redeploy, e.g. sha-abc1234 (NOT latest — latest is overwritten on every deploy, so it never rolls back)"
        required: true

# Never run two production-target deploys at once (staging shares this group).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pkubersua.com
    steps:
      - name: Resolve image tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.ver.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image from the merged commit and push it as :sha-<short> plus
      # :latest. On a rollback run this is skipped — the older image already
      # exists in GHCR and the server just pulls it. Rollbacks also skip the
      # forward-migration step below because historical images may predate the
      # runtime migrator.
      - name: Build and push release image
        if: steps.ver.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL || 'hello@pkubersua.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ship the repo's compose file to the server so it cannot drift. It used to
      # be copied by hand, and a stray `pull_policy: never` edited straight onto
      # the box broke every deploy from 2026-08-31 to 2026-09-06 while the old
      # container kept serving, so only Actions went red. Uploaded beside the
      # live file; the script below swaps it in and keeps a backup.
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.DEPLOY_DIR }}/.incoming
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"

            # Adopt the repo's compose file. `.env` is NOT touched — secrets stay
            # on the server. Any hand-edit on the box is reported and reverted:
            # the repo is the source of truth for this file.
            incoming=".incoming/docker-compose.deploy.yml"
            if [ ! -f "$incoming" ]; then
              echo "::error::compose file was not uploaded"; exit 1
            fi
            if ! cmp -s "$incoming" docker-compose.deploy.yml; then
              echo "compose file differs from the repo — updating (previous kept as .bak-*):"
              diff -u docker-compose.deploy.yml "$incoming" || true
              cp -a docker-compose.deploy.yml "docker-compose.deploy.yml.bak-$(date +%Y%m%d-%H%M%S)"
              mv "$incoming" docker-compose.deploy.yml
            else
              echo "compose file already matches the repo"
              rm -f "$incoming"
            fi
            rmdir .incoming 2>/dev/null || true

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export IMAGE_TAG='${{ steps.ver.outputs.tag }}'
            docker compose -f docker-compose.deploy.yml pull
            if [ "${{ steps.ver.outputs.build }}" = "true" ]; then
              # Apply the new image's migrations before replacing the live app.
              # If this fails, set -e keeps the old app serving instead of
              # shipping code against an older schema.
              docker compose -f docker-compose.deploy.yml up -d --wait postgres
              docker compose -f docker-compose.deploy.yml --profile migrations run --rm migrate
            else
              # Rollbacks may target an image built before the runtime migrator
              # was added. Migrations are append-only, so do not apply newer
              # schema changes while restoring an older application image.
              echo "Rollback requested; skipping forward migrations"
            fi
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}

      # The deploy is already live here, so this does not prevent a bad release
      # -- it makes one VISIBLE. See the script header for why an anonymous
      # homepage ping is not enough (issues #60 / #61).
      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}"
