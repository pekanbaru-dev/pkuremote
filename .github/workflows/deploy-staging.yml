name: Deploy (staging-test)

# Force-deploys the `staging-test` branch with NO approval gate — a push here
# builds and deploys immediately (no PR, no Approve click). There is no separate
# staging host yet, so it targets the SAME box/domain/DB as production
# (https://pkubersua.com): a push to `staging-test` goes live on the real site.
#
# It has NO `environment:` (that's what removes the gate), so it authenticates
# with REPO-level secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_DIR.
# Push-only, no `workflow_dispatch`: a manual dispatch could pick ANY ref and
# ship it to the prod box with no gate, so the only way in is an actual push to
# `staging-test`.
on:
  push:
    branches: [staging-test]

# Share the production concurrency group so a staging deploy and a prod deploy
# can never run against the box at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only a real push to the `staging-test` branch may run this ungated,
    # prod-targeting job. `github.event.deleted` rejects branch-DELETION push
    # events (their SHA falls back to the default branch, which would otherwise
    # deploy the wrong image as `:staging`).
    if: github.ref_name == 'staging-test' && github.event.deleted != true
    # No `environment:` on purpose → no approval gate (force deploy). Reads
    # repo-level SSH secrets (env-scoped secrets would require the gated env).
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL || 'hello@pkubersua.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export IMAGE_TAG='staging'
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}

      # This workflow is UNGATED and targets the production domain/database, so
      # a broken push goes live with no human in the loop. The smoke test is the
      # only automated signal that it actually works (issues #60 / #61).
      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.com' }}"
