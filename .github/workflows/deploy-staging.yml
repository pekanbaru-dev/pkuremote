name: Deploy (staging-test)

# Force-deploys the `staging-test` branch with NO approval gate — a push here
# goes live immediately. There is no separate staging server yet, so this
# targets the SAME box, domain, and database as production
# (https://pkubersua.web.id). Treat a push to `staging-test` as "deploy to prod
# right now, no approval." When a real staging host exists, point this at it.
#
# Uses REPO-level secrets (SSH_HOST/SSH_USER/SSH_PRIVATE_KEY/DEPLOY_DIR) — it
# has no `environment:` (that's what removes the gate), so it cannot read
# environment-scoped secrets.
on:
  push:
    branches: [staging-test]
  workflow_dispatch:

# Share the production concurrency group so a staging deploy and a prod deploy
# can never run against the box at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` on purpose → no approval gate (force deploy).
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://pkubersua.web.id' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL || 'hello@pkubersua.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            export IMAGE_TAG='staging'
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
