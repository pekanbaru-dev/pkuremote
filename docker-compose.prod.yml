# Production stack for the SvelteKit FE (builds the image locally).
#
# Three services: `app` (the prod Node bundle), `postgres` (in-stack database —
# no more external Supabase), and `caddy` (HTTPS reverse proxy with automatic
# Let's Encrypt certs). Only `caddy` publishes host ports (80/443); `app` and
# `postgres` are reachable only on the internal Docker network. No Supabase.
#
# Usage:
#   cp .env.example .env   # fill SITE_DOMAIN, ACME_EMAIL, POSTGRES_*, OIDC_*
#   docker compose -f docker-compose.prod.yml up -d --build
#   # apply migrations against the in-stack db (one-off, from the app image):
#   docker compose -f docker-compose.prod.yml run --rm app node -e "…"  # see DEPLOY.md
#
# Rollback:
#   docker compose -f docker-compose.prod.yml down

services:
  app:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-hello@pkubersua.com}
    environment:
      PORT: 3000
      ORIGIN: https://${SITE_DOMAIN}
      # In-stack Postgres over the internal network (no external database).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      # OIDC → Google in production (generic OIDC; same code path as dev's Dex).
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      # Admin allow-list read at runtime by requireAdmin ($env/dynamic/private).
      # Without it the /admin panel fails closed (no admins) in production.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Cloudflare R2 object storage — replaces the old UPLOAD_DIR/uploads_data volume.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    volumes:
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
