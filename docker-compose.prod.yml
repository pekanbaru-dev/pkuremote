# Production stack for the SvelteKit FE.
#
# Brings up two services: `app` (the prod Node bundle) and `caddy` (HTTPS
# reverse proxy with automatic Let's Encrypt certs). The `app` service is
# reachable only on the internal Docker network; the `caddy` service
# publishes ports 80 and 443 to the host.
#
# Usage:
#   cp .env.example .env   # fill in SITE_DOMAIN and ACME_EMAIL
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f caddy   # watch cert issuance
#
# Rollback:
#   docker compose -f docker-compose.prod.yml down

services:
  app:
    build: .
    environment:
      PORT: 3000
      ORIGIN: https://${SITE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
