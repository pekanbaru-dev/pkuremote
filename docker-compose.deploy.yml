# Registry-based production stack — this is what the SERVER runs.
#
# Unlike docker-compose.prod.yml (which builds the image locally), this file
# PULLS the image that the Deploy workflow built and pushed to GHCR. The server
# never needs the source code — only this file, the Caddyfile, and a .env.
#
# First run on the server:
#   IMAGE_TAG=v1.0.0 docker compose -f docker-compose.deploy.yml up -d
# The Deploy workflow sets IMAGE_TAG for you on each release; `latest` is the
# fallback. See DEPLOY.md for the full setup.

services:
  app:
    image: ghcr.io/pekanbaru-dev/pkuremote:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      PORT: 3000
      ORIGIN: https://${SITE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      # Admin allow-list read at runtime by requireAdmin ($env/dynamic/private).
      # Without it the /admin panel fails closed (no admins) in production.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
